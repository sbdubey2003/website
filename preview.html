          const gain = ctx.createGain();

                <button onClick={() => handleSendMessage('We need urgent on-site engineer support')} className="text-[11px] px-2.5 py-1 rounded-full bg-white hover:bg-rose-50 text-rose-600 border border-rose-200 transition whitespace-nowrap flex-shrink-0">🚨 Emergency Visit</button>
                <button onClick={() => handleSendMessage('Where is your Faridabad office located?')} className="text-[11px] px-2.5 py-1 rounded-full bg-white hover:bg-blue-50 text-slate-700 hover:text-blue-700 border border-slate-200 transition whitespace-nowrap flex-shrink-0">📍 Office Location</button>
              </div>

              <div className="p-3 bg-white border-t border-slate-200 flex items-center space-x-2">
                <button
                  type="button"
                  onClick={toggleSpeechRecognition}
                  className={`p-2.5 rounded-xl transition ${isListening ? 'bg-rose-500 text-white animate-pulse' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                  title={isListening ? 'Listening...' : 'Voice input'}
                >
                  <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" /><path d="M19 10v2a7 7 0 0 1-14 0v-2" /><line x1="12" y1="19" x2="12" y2="22" /></svg>
                </button>

                <input
                  ref={inputRef}
                  type="text"
                  value={input}
                  onChange={e => setInput(e.target.value)}
                  onKeyDown={handleKeyDown}
                  placeholder={isListening ? 'Listening to voice...' : 'Ask about laptops, AMC, CCTV, Wi-Fi...'}
                  className="flex-1 px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:bg-white transition"
                />

                <button
                  type="button"
                  onClick={() => handleSendMessage()}
                  disabled={!input.trim()}
                  className="p-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white hover:from-blue-700 hover:to-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed shadow-md transition"
                >
                  <svg className="w-4 h-4 transform rotate-90" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="19" x2="12" y2="5" /><polyline points="5 12 12 5 19 12" /></svg>
                </button>
              </div>

              <div className="bg-slate-50 px-3 py-1.5 border-t border-slate-100 flex items-center justify-between text-[10px] text-slate-400">
                <span>Network 4 Technologies • 24x7 IT Hub</span>
                <span className="flex items-center text-emerald-600 font-medium">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1"></span>
                  Faridabad & Pan-India
                </span>
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- Main App ---
    const App = () => (
      <div className="flex flex-col min-h-screen bg-slate-50 text-slate-900">
        <Header />
        <main>
          <Hero />
          <Services />
          <AMCCalculator />
          <WhyChooseUs />
          <CTA />
          <Contact />
        </main>
        <Footer />
        <AIChatBot />
      </div>
    );

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
