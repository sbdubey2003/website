            { label: '💬 Connect on WhatsApp', actionType: 'whatsapp', payload: `Hi N4T, I have a requirement regarding: ${userQuery}` },
            { label: '📞 Call +91 7988678921', actionType: 'call', payload: '+917988678921' },
            { label: '📝 Request Formal Quote', actionType: 'scroll', payload: 'contact' }
          ]
        };
      };

      const handleSendMessage = (textToSend) => {
        const messageText = textToSend || input;
        if (!messageText.trim()) return;

        const userMessage = {
          id: 'usr_' + Date.now(),
          sender: 'user',
          text: messageText.trim(),
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setMessages(prev => [...prev, userMessage]);
        if (!textToSend) setInput('');
        setIsTyping(true);

        setTimeout(() => {
          const botResponse = generateBotReply(messageText);
          const botMessage = {
            id: 'bot_' + Date.now(),
            sender: 'bot',
            text: botResponse.text,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            actions: botResponse.actions
          };

          setMessages(prev => [...prev, botMessage]);
          setIsTyping(false);
          playChime();
          speakText(botResponse.text);

          if (!isOpen) {
            setHasUnread(true);
          }
        }, 550);
      };

      const handleActionClick = (action) => {
        if (action.actionType === 'whatsapp') {
          const url = `https://wa.me/message/PTHIABDDRPO4E1?text=${encodeURIComponent(action.payload)}`;
          window.open(url, '_blank');
        } else if (action.actionType === 'call') {
          window.location.href = `tel:${action.payload}`;
        } else if (action.actionType === 'scroll') {
          const elem = document.getElementById(action.payload);
          if (elem) elem.scrollIntoView({ behavior: 'smooth' });
        } else if (action.actionType === 'prompt') {
          handleSendMessage(action.payload);
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter') handleSendMessage();
      };

      const renderFormattedText = (content) => {
        const lines = content.split('\n');
        return lines.map((line, idx) => {
          const isBullet = line.trim().startsWith('•');
          const parts = line.split(/(\*\*.*?\*\*)/g);
          const parsedParts = parts.map((part, pIdx) => {
            if (part.startsWith('**') && part.endsWith('**')) {
              return <strong key={pIdx} className="font-bold text-slate-900">{part.slice(2, -2)}</strong>;
            }
            return part;
          });
          return (
            <div key={idx} className={`${isBullet ? 'pl-2 my-0.5' : 'my-1'} leading-relaxed`}>
              {parsedParts}
            </div>
          );
        });
      };

      return (
        <div className="fixed bottom-6 right-6 z-50 font-sans">
          {showTooltip && !isOpen && (
            <div className="absolute bottom-16 right-0 mb-2 w-64 bg-white/95 backdrop-blur-md p-3.5 rounded-2xl shadow-xl border border-blue-100 text-xs text-slate-700 animate-bounce">
              <div className="flex items-start space-x-2">
                <span className="text-xl">🤖</span>
                <div className="flex-1">
                  <p className="font-bold text-primary-700">Need instant IT support or pricing?</p>
                  <p className="text-[11px] text-slate-500 mt-0.5">Chat with our 24x7 AI Assistant for quick quotes & assistance!</p>
                </div>
                <button onClick={(e) => { e.stopPropagation(); setShowTooltip(false); }} className="text-slate-400 hover:text-slate-600 font-bold">×</button>
              </div>
              <div className="absolute -bottom-2 right-6 w-4 h-4 bg-white border-b border-r border-blue-100 transform rotate-45"></div>
            </div>
          )}

          {!isOpen && (
            <button
              onClick={() => setIsOpen(true)}
              className="relative group flex items-center space-x-2 px-3 py-2 sm:px-3.5 sm:py-2.5 rounded-full bg-gradient-to-r from-blue-600 via-indigo-600 to-cyan-500 text-white shadow-lg hover:shadow-blue-500/40 hover:scale-105 active:scale-95 transition-all duration-200 focus:outline-none border border-white/25"
              aria-label="Open N4T AI Chatbot"
            >
              <span className="absolute -inset-0.5 rounded-full bg-blue-500 opacity-40 group-hover:opacity-75 animate-ping duration-1000 pointer-events-none"></span>
              <span className="relative z-10 text-base sm:text-lg flex items-center justify-center">
                🤖
              </span>
              <div className="relative z-10 text-left">
                <div className="font-bold text-[11px] sm:text-xs tracking-tight flex items-center space-x-1 leading-tight">
                  <span>Ask N4T AI</span>
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                </div>
                <div className="hidden sm:block text-[8px] text-cyan-100 font-medium leading-tight">
                  24x7 IT Help
                </div>
              </div>
              {hasUnread && <span className="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-rose-500 border border-white animate-pulse"></span>}
            </button>
          )}

          {isOpen && (
            <div className="flex flex-col w-[92vw] sm:w-[390px] md:w-[410px] h-[580px] max-h-[82vh] bg-white rounded-3xl shadow-2xl border border-slate-200/90 overflow-hidden transform transition-all duration-300 ease-out">
              <div className="bg-gradient-to-r from-blue-700 via-indigo-700 to-blue-600 text-white p-4 flex items-center justify-between shadow-md">
                <div className="flex items-center space-x-3">
                  <div className="relative">
                    <div className="w-10 h-10 rounded-2xl bg-white/10 backdrop-blur-md flex items-center justify-center border border-white/20">
                      <svg className="w-6 h-6 text-cyan-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                        <rect width="16" height="12" x="4" y="8" rx="2" />
                        <path d="M2 14h2" />
                        <path d="M20 14h2" />
                        <path d="M15 13v2" />
                        <path d="M9 13v2" />
                        <path d="M12 4v4" />
                        <circle cx="12" cy="3" r="1" />
                      </svg>
                    </div>
                    <span className="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-emerald-400 border-2 border-blue-700"></span>
                  </div>
                  <div>
                    <h3 className="font-bold text-sm sm:text-base leading-tight font-display flex items-center">
                      N4T AI Assistant
                      <span className="ml-2 px-1.5 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-400/30">24x7</span>
                    </h3>
                    <p className="text-[11px] text-blue-100/90">Smart Enterprise IT Advisor</p>
                  </div>
                </div>

                <div className="flex items-center space-x-1.5">
                  <button
                    onClick={() => setIsVoiceMuted(!isVoiceMuted)}
                    className={`p-1.5 rounded-xl transition ${isVoiceMuted ? 'text-white/60 hover:text-white hover:bg-white/10' : 'text-emerald-300 bg-white/10'}`}
                    title={isVoiceMuted ? 'Voice muted (Click to unmute)' : 'Voice active (Click to mute)'}
                  >
                    {isVoiceMuted ? (
                      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 5L6 9H2v6h4l5 4V5z" /><line x1="23" y1="9" x2="17" y2="15" /><line x1="17" y1="9" x2="23" y2="15" /></svg>
                    ) : (
                      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 5L6 9H2v6h4l5 4V5z" /><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" /></svg>
                    )}
                  </button>

                  <button
                    onClick={() => setMessages([{ id: 'reset', sender: 'bot', text: '**Chat reset.** How else can N4T IT Assistant help you today?', timestamp: 'Just now', actions: [{ label: '💻 Hardware Quote', actionType: 'prompt', payload: 'Give me a quote for laptops' }, { label: '⚙️ AMC Rates', actionType: 'prompt', payload: 'What are the AMC contract rates?' }] }])}
                    className="p-1.5 rounded-xl text-white/60 hover:text-white hover:bg-white/10 transition"
                    title="Restart chat"
                  >
                    <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></svg>
                  </button>

                  <button onClick={() => setIsOpen(false)} className="p-1.5 rounded-xl text-white/80 hover:text-white hover:bg-white/10 transition">
                    <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>
                  </button>
                </div>
              </div>

              <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50/70 text-xs sm:text-sm">
                {messages.map(msg => (
                  <div key={msg.id} className={`flex flex-col ${msg.sender === 'user' ? 'items-end' : 'items-start'}`}>
                    <div className={`max-w-[85%] rounded-2xl px-4 py-3 shadow-sm ${msg.sender === 'user' ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-tr-none' : 'bg-white border border-slate-200 text-slate-800 rounded-tl-none'}`}>
                      {renderFormattedText(msg.text)}
                      {msg.actions && msg.actions.length > 0 && (
                        <div className="mt-3 pt-2.5 border-t border-slate-100 flex flex-wrap gap-1.5">
                          {msg.actions.map((act, idx) => (
                            <button
                              key={idx}
                              onClick={() => handleActionClick(act)}
                              className="px-2.5 py-1.5 rounded-xl text-[11px] font-semibold bg-blue-50 hover:bg-blue-600 text-blue-700 hover:text-white border border-blue-200/80 transition-all flex items-center space-x-1"
                            >
                              <span>{act.label}</span>
                              <span className="text-[10px] opacity-70">&rarr;</span>
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                    <span className="text-[10px] text-slate-400 mt-1 px-1">{msg.timestamp}</span>
                  </div>
                ))}

                {isTyping && (
                  <div className="flex items-center space-x-2 bg-white border border-slate-200 rounded-2xl rounded-tl-none px-4 py-3 w-24 shadow-sm">
                    <span className="w-2 h-2 rounded-full bg-blue-500 animate-bounce"></span>
                    <span className="w-2 h-2 rounded-full bg-blue-500 animate-bounce [animation-delay:0.2s]"></span>
                    <span className="w-2 h-2 rounded-full bg-blue-500 animate-bounce [animation-delay:0.4s]"></span>
                  </div>
                )}
                <div ref={messagesEndRef} />
              </div>

              <div className="px-3 py-2 bg-slate-100/90 border-t border-slate-200 overflow-x-auto no-scrollbar flex items-center space-x-2">
                <span className="text-[10px] font-bold uppercase tracking-wider text-slate-500 flex-shrink-0">Quick:</span>
                <button onClick={() => handleSendMessage('Give me a quote for commercial laptops and desktops')} className="text-[11px] px-2.5 py-1 rounded-full bg-white hover:bg-blue-50 text-slate-700 hover:text-blue-700 border border-slate-200 transition whitespace-nowrap flex-shrink-0">💻 Laptop & PC Quote</button>
                <button onClick={() => handleSendMessage('Calculate AMC for 15 PCs and 8 CCTVs')} className="text-[11px] px-2.5 py-1 rounded-full bg-white hover:bg-blue-50 text-slate-700 hover:text-blue-700 border border-slate-200 transition whitespace-nowrap flex-shrink-0">⚙️ Calculate AMC</button>
                <button onClick={() => handleSendMessage('What are your CCTV camera installation rates and brands?')} className="text-[11px] px-2.5 py-1 rounded-full bg-white hover:bg-blue-50 text-slate-700 hover:text-blue-700 border border-slate-200 transition whitespace-nowrap flex-shrink-0">📹 CCTV Setup</button>
                <button onClick={() => handleSendMessage('We need urgent on-site engineer support')} className="text-[11px] px-2.5 py-1 rounded-full bg-white hover:bg-rose-50 text-rose-600 border border-rose-200 transition whitespace-nowrap flex-shrink-0">🚨 Emergency Visit</button>
                <button onClick={() => handleSendMessage('Where is your Faridabad office located?')} className="text-[11px] px-2.5 py-1 rounded-full bg-white hover:bg-blue-50 text-slate-700 hover:text-blue-700 border border-slate-200 transition whitespace-nowrap flex-shrink-0">📍 Office Location</button>
              </div>

              <div className="p-3 bg-white border-t border-slate-200 flex items-center space-x-2">
                <button
                  type="button"
                  onClick={toggleSpeechRecognition}
                  className={`p-2.5 rounded-xl transition ${isListening ? 'bg-rose-500 text-white animate-pulse' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                  title={isListening ? 'Listening...' : 'Voice input'}
                >
                  <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" /><path d="M19 10v2a7 7 0 0 1-14 0v-2" /><line x1="12" y1="19" x2="12" y2="22" /></svg>
                </button>

                <input
                  ref={inputRef}
                  type="text"
                  value={input}
                  onChange={e => setInput(e.target.value)}
                  onKeyDown={handleKeyDown}
                  placeholder={isListening ? 'Listening to voice...' : 'Ask about laptops, AMC, CCTV, Wi-Fi...'}
                  className="flex-1 px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:bg-white transition"
                />

                <button
                  type="button"
                  onClick={() => handleSendMessage()}
                  disabled={!input.trim()}
                  className="p-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white hover:from-blue-700 hover:to-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed shadow-md transition"
                >
                  <svg className="w-4 h-4 transform rotate-90" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="19" x2="12" y2="5" /><polyline points="5 12 12 5 19 12" /></svg>
                </button>
              </div>

              <div className="bg-slate-50 px-3 py-1.5 border-t border-slate-100 flex items-center justify-between text-[10px] text-slate-400">
                <span>Network 4 Technologies • 24x7 IT Hub</span>
                <span className="flex items-center text-emerald-600 font-medium">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1"></span>
                  Faridabad & Pan-India
                </span>
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- Main App ---
    const App = () => (
      <div className="flex flex-col min-h-screen bg-slate-50 text-slate-900">
        <Header />
        <main>
          <Hero />
          <Services />
          <AMCCalculator />
          <WhyChooseUs />
          <CTA />
          <Contact />
        </main>
        <Footer />
        <AIChatBot />
      </div>
    );

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
